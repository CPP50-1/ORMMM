[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ormmm"
version = "0.1.0"
description = "Mini-ORM for CPP50"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2.0",
    "pytest>=8.3.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ormmm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]